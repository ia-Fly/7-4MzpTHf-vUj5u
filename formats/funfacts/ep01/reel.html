<script>
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eOut = x => 1 - Math.pow(1 - x, 3), eIO = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const spring = x => x <= 0 ? 0 : x >= 1 ? 1 : 1 - Math.exp(-6 * x) * Math.cos(10 * x);
const lerp = (a, b, x) => a + (b - a) * x;
const win = (t, a, b, fi = 0.1, fo = 0.1) => clamp(seg(t, a, a + fi)) * (1 - seg(t, b - fo, b));
const pop = (t, a, d = 0.12) => 0.84 + 0.16 * spring(seg(t, a, a + d * 3));
const DUR = 28.9;
// phrases de la voix (début, fin, texte ; « | » = coupe de sous-titre ; *rouge* ; _menthe_)
const S = [
 [0.00, 2.75, "Le signe|numéro un|qu'un couple|va se *séparer*…"],
 [3.21, 4.34, "ce n'est pas|la *tromperie*."],
 [4.84, 5.66, "c'est le *mépris*."],
 [6.34, 10.46, "le psychologue|John Gottman|a observé|des *milliers*|de couples|pendant *40 ans*."],
 [10.89, 12.57, "et le mépris,|ça ressemble|à ça :"],
 [13.11, 14.25, "lever les yeux|*au ciel*."],
 [14.86, 15.67, "le *sarcasme*."],
 [16.07, 16.97, "les petites|*moqueries*."],
 [17.43, 19.59, "parce que|derrière,|le message,|c'est :"],
 [19.90, 20.90, "« je vaux|*mieux que toi* »"],
 [21.47, 22.08, "l'antidote ?"],
 [22.47, 23.26, "dire _merci_."],
 [23.59, 24.67, "même pour|des petits trucs."],
 [25.21, 27.42, "alors|la prochaine fois|que tu lèves|les yeux *au ciel*…"],
 [27.73, 28.35, "souviens-toi :"]];
const CAPS = [];
for (const [a, b, txt] of S) {
  const parts = txt.split('|'), tot = parts.reduce((s, p) => s + p.length, 0); let acc = 0;
  for (const p of parts) { CAPS.push({ t: a + (b - a) * acc / tot - 0.04, txt: p }); acc += p.length; }
}
const EV = { crack: 2.05, cheat: [3.21, 4.75], x: 3.85, rule: [4.84, 6.25], study: [6.34, 10.7], push: 11.2, roll: [13.35, 14.6], bub1: [14.86, 15.95], bub2: [16.07, 17.25],
  grow: [17.6, 21.3], hidden: [19.9, 21.25], anti: [21.47, 22.35], merci: 22.55, roll2: [26.55, 27.75] };
// plans caméra [t, fx, fy, s, fx2, fy2, s2] (le dernier finit sur le cadrage du début → boucle)
const SH = [
 [0, 540, 930, 1.25, 540, 915, 1.32],
 [3.21, 540, 930, 1.18, 540, 930, 1.18],
 [6.34, 540, 930, 1.18, 540, 930, 1.18],
 [10.89, 540, 925, 1.25, 420, 850, 1.75],
 [12.2, 420, 850, 1.75, 420, 845, 1.85],
 [17.43, 540, 930, 1.25, 540, 925, 1.3],
 [22.47, 560, 900, 1.38, 560, 900, 1.45],
 [25.21, 540, 915, 1.38, 540, 930, 1.25]];
const GA = [[0, 1], [2.05, 2], [5.0, 4], [13.4, 5], [22.6, 1]];
function camAt(t) {
  let si = 0; for (let i = 0; i < SH.length; i++) if (t >= SH[i][0]) si = i;
  const s0 = SH[si], s1t = si + 1 < SH.length ? SH[si + 1][0] : DUR - 0.5;
  const u = si === 3 ? eIO(seg(t, EV.push, s1t)) : eIO(seg(t, s0[0], s1t)) * 0.85 + seg(t, s0[0], s1t) * 0.15;
  return [lerp(s0[1], s0[4], u), lerp(s0[2], s0[5], u), lerp(s0[3], s0[6], u)];
}
function shake(t) {
  let x = 0, y = 0;
  for (const [ti, amp] of [[EV.crack, 8], [EV.x, 6], [EV.rule[0] + 0.05, 7], [EV.hidden[0] + 0.05, 5]]) {
    if (t >= ti && t < ti + 0.5) { const k = Math.exp(-(t - ti) * 9) * amp; x += k * Math.sin((t - ti) * 71); y += k * Math.cos((t - ti) * 57); }
  }
  return [x, y];
}
// grille des couples (étude)
(function () {
  let s = '';
  for (let r = 0; r < 5; r++) for (let c = 0; c < 8; c++) {
    const i = r * 8 + c, x = 70 + c * 108, y = 70 + r * 106;
    s += `<g id="cp${i}" opacity="0" transform="translate(${x} ${y})"><circle cx="-16" cy="0" r="17" fill="#2E3035" stroke="#E8E5DB" stroke-width="3.5"/><circle cx="16" cy="2" r="15" fill="#2E3035" stroke="#E8E5DB" stroke-width="3.5"/><path d="M-34 40 Q -16 20 0 40 Q 16 22 32 40" fill="none" stroke="#E8E5DB" stroke-opacity="0.6" stroke-width="3.5" stroke-linecap="round"/></g>`;
  }
  $('grid').innerHTML = s;
})();
function rollAmt(t) {  // 0 = regard normal, 1 = yeux au ciel
  let k = 0;
  for (const [a, b] of [EV.roll, EV.roll2]) k = Math.max(k, eOut(seg(t, a, a + 0.35)) * (1 - eIO(seg(t, b - 0.4, b))));
  return k;
}
let curCap = -1;
function render(t) {
  let [fx, fy, s] = camAt(t);
  const [kx, ky] = shake(t);
  $('cam').setAttribute('transform', `translate(${(540 + kx).toFixed(2)} ${(900 + ky).toFixed(2)}) scale(${s.toFixed(4)}) translate(${(-fx).toFixed(2)} ${(-fy).toFixed(2)})`);
  // respiration légère
  const br = Math.sin(t * 2.2) * 2.5, br2 = Math.sin(t * 2.0 + 1.3) * 2.5;
  // A grandit / B rapetisse (« je vaux mieux que toi »)
  const g = eOut(seg(t, EV.grow[0], EV.grow[0] + 0.5)) * (1 - eIO(seg(t, EV.grow[1] - 0.5, EV.grow[1])));
  $('Abody').setAttribute('transform', `translate(400 1150) scale(${(1 + 0.22 * g).toFixed(4)}) translate(-400 -1150) translate(0 ${br.toFixed(2)})`);
  $('Bbody').setAttribute('transform', `translate(682 1150) scale(${(1 - 0.16 * g).toFixed(4)}) translate(-682 -1150) translate(0 ${br2.toFixed(2)})`);
  // yeux de A
  const rl = rollAmt(t);
  $('Ap1').setAttribute('cy', (-4 - 11 * rl).toFixed(2)); $('Ap2').setAttribute('cy', (-4 - 11 * rl).toFixed(2));
  $('Ap1').setAttribute('cx', (8 - 4 * rl).toFixed(2)); $('Ap2').setAttribute('cx', (44 - 4 * rl).toFixed(2));
  const lid = 10 * rl;
  $('Alid').setAttribute('d', false ? `M-13 -6 Q 2 ${(-22 + lid * 0.2).toFixed(1)} 17 -6 L17 ${(-6 + lid).toFixed(1)} Q 2 ${(4 + lid).toFixed(1)} -13 ${(-6 + lid).toFixed(1)} Z M23 -6 Q 38 ${(-22 + lid * 0.2).toFixed(1)} 53 -6 L53 ${(-6 + lid).toFixed(1)} Q 38 ${(4 + lid).toFixed(1)} 23 ${(-6 + lid).toFixed(1)} Z` : '');
  $('Alid').setAttribute('transform', 'translate(0 0)');
  $('AeyeGlow').setAttribute('opacity', (rl * (0.75 + 0.25 * Math.sin(t * 9))).toFixed(3));
  const tilt = rl * -7;
  $('Ahead').setAttribute('transform', `translate(400 848) rotate(${tilt.toFixed(2)})`);
  // bouche : sourire narquois pendant sarcasme / moqueries / message caché
  const smirk = Math.max(win(t, EV.bub1[0], EV.hidden[1], 0.15, 0.25), 0);
  $('Amouth').setAttribute('d', `M6 ${(30 + 2 * smirk).toFixed(1)} Q 22 ${(36 - 2 * smirk).toFixed(1)} 38 ${(30 - 12 * smirk).toFixed(1)}`);
  const sad = win(t, EV.crack, EV.merci + 0.3, 0.3, 0.3), joy = win(t, EV.merci, 25.6, 0.2, 0.5);
  $('Bmouth').setAttribute('d', `M-36 ${(30 + 4 * sad).toFixed(1)} Q -20 ${(34 - 8 * sad + 8 * joy).toFixed(1)} -4 ${(30 + 4 * sad).toFixed(1)}`);
  // cœur : se fend, s'écarte, se ressoude au « merci »
  const split = eOut(seg(t, EV.crack, EV.crack + 0.45)) * (1 - eIO(seg(t, EV.merci, EV.merci + 0.55)));
  const crackO = t >= EV.crack - 0.02 && t < EV.merci + 0.6 ? 1 : 0;
  const beat = 1 + 0.05 * Math.max(0, Math.sin(t * 7.5)) * (split < 0.05 ? 1 : 0);
  $('heart').setAttribute('transform', `translate(541 ${(730 + 6 * Math.sin(t * 1.6)).toFixed(2)}) scale(${(beat * (t > EV.merci ? pop(t, EV.merci + 0.45) * 1.0 + 0.0 : 1)).toFixed(4)})`);
  $('hLeft').setAttribute('transform', `translate(${(-30 * split).toFixed(2)} ${(10 * split).toFixed(2)}) rotate(${(-14 * split).toFixed(2)} 0 30)`);
  $('hRight').setAttribute('transform', `translate(${(30 * split).toFixed(2)} ${(10 * split).toFixed(2)}) rotate(${(14 * split).toFixed(2)} 0 30)`);
  $('hCrack').setAttribute('opacity', (crackO * (1 - split) * 0.9).toFixed(3));
  $('hGlow').setAttribute('opacity', win(t, EV.merci + 0.4, 25.4, 0.2, 0.6).toFixed(3));
  // étincelles menthe au merci
  let sp = '';
  if (t > EV.merci + 0.4 && t < EV.merci + 2.4) for (let i = 0; i < 10; i++) {
    const k = clamp((t - EV.merci - 0.4) / 2), a = i / 10 * Math.PI * 2 + 0.3, r = 90 + 140 * eOut(k);
    sp += `<circle cx="${(541 + Math.cos(a) * r).toFixed(1)}" cy="${(700 + Math.sin(a) * r * 0.8 - 60 * k).toFixed(1)}" r="${(7 * (1 - k)).toFixed(2)}" fill="#5EF5B4"/>`;
  }
  $('sparks').innerHTML = sp;
  // bulles et étiquette
  for (const [id, [a, b], cx, cy] of [['bub1', EV.bub1, 410, 790], ['bub2', EV.bub2, 410, 790], ['bub3', [EV.merci, 24.9], 688, 790]]) {
    $(id).setAttribute('opacity', win(t, a, b, 0.08, 0.15).toFixed(3));
    $(id).setAttribute('transform', `translate(${cx} ${cy}) scale(${pop(t, a).toFixed(3)}) translate(${-cx} ${-cy})`);
  }
  $('tagEyes').setAttribute('opacity', win(t, EV.roll[0] + 0.2, EV.roll[1], 0.08, 0.15).toFixed(3));
  $('tagEyes').setAttribute('transform', `translate(400 720) scale(${pop(t, EV.roll[0] + 0.2).toFixed(3)}) translate(-400 -720)`);
  // cartes
  const card = (id, a, b, fi = 0.07, fo = 0.12) => { $(id).style.opacity = win(t, a, b, fi, fo).toFixed(3); $(id).style.transform = `scale(${pop(t, a).toFixed(3)})`; };
  card('cheat', EV.cheat[0], EV.cheat[1]); $('xMark').setAttribute('opacity', t >= EV.x ? 1 : 0);
  $('xMark').setAttribute('transform', `translate(210 265) scale(${(t >= EV.x ? 1.25 - 0.25 * spring(seg(t, EV.x, EV.x + 0.3)) : 1).toFixed(3)}) translate(-210 -265)`);
  card('rule', EV.rule[0], EV.rule[1]);
  $('ruleJ').style.transform = `scale(${(0.86 + 0.14 * spring(seg(t, EV.rule[0] + 0.25, EV.rule[0] + 0.6))).toFixed(3)})`;
  card('study', EV.study[0], EV.study[1]);
  for (let i = 0; i < 40; i++) { const ti = EV.study[0] + 0.35 + i * 0.07; $('cp' + i).setAttribute('opacity', (t >= ti ? clamp((t - ti) / 0.1) : 0).toFixed(2)); }
  $('yrs').textContent = Math.round(40 * eOut(seg(t, 8.6, 9.9))) + ' ANS';
  card('hidden', EV.hidden[0], EV.hidden[1]);
  card('anti', EV.anti[0], EV.anti[1]);
  // jauge
  let gv = 1; for (const [ti, v] of GA) if (t >= ti) gv = v;
  const mint = t >= 22.6 && t < 25.2; if (t >= 25.2) gv = 1;
  for (let i = 1; i <= 5; i++) { const el = $('g' + i); el.className = 'sg' + (i <= gv ? (mint ? ' mint' : gv >= 4 ? ' hot' : ' on') : ''); el.style.opacity = gv >= 5 && i <= gv ? (0.55 + 0.45 * Math.abs(Math.sin(t * 6))).toFixed(2) : 1; }
  $('state').textContent = mint ? 'RÉPARÉ' : gv >= 5 ? 'CRITIQUE' : gv >= 2 ? 'FISSURE' : 'STABLE';
  $('state').style.color = mint ? '#5EF5B4' : gv >= 2 ? '#FF4B2B' : '#E8E5DB';
  // sous-titres
  let ci = 0; for (let i = 0; i < CAPS.length; i++) if (t >= CAPS[i].t) ci = i;
  const cap = $('cap');
  if (ci !== curCap) {
    curCap = ci;
    cap.innerHTML = '<span class="w" id="capIn">' + CAPS[ci].txt.replace(/\*([^*]+)\*/g, '<span class="r">$1</span>').replace(/_([^_]+)_/g, '<span class="g">$1</span>') + '</span>';
    const w = $('capIn').offsetWidth; cap.dataset.fit = Math.min(1, 900 / Math.max(1, w)).toFixed(4);
  }
  const c = CAPS[ci], t0 = Math.max(0, c.t);
  cap.style.opacity = 1; cap.style.transform = `scale(${(pop(t, t0, 0.08) * parseFloat(cap.dataset.fit || 1)).toFixed(4)})`;
}
window.render = render;
document.fonts.ready.then(() => { render(0); window.__ready = true; });
</script>
</body></html>
