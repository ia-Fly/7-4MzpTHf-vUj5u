<script>
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eOut = x => 1 - Math.pow(1 - x, 3), eIO = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const spring = x => x <= 0 ? 0 : x >= 1 ? 1 : 1 - Math.exp(-6 * x) * Math.cos(10 * x);
const lerp = (a, b, x) => a + (b - a) * x;
const win = (t, a, b, fi = 0.1, fo = 0.1) => clamp(seg(t, a, a + fi)) * (1 - seg(t, b - fo, b));
const pop = (t, a, d = 0.12) => 0.84 + 0.16 * spring(seg(t, a, a + d * 3));
const DUR = 28.5;
const S = [
 [0.03, 2.77, "te rincer la bouche|après le brossage,|c'est une *erreur*."],
 [3.44, 5.48, "le service de santé|britannique|est formel :"],
 [5.85, 8.66, "l'eau *emporte*|le fluor concentré|resté sur tes dents."],
 [9.34, 11.82, "elle le *dilue*,|et réduit son effet|protecteur."],
 [12.50, 13.59, "le bain de bouche|juste après ?"],
 [13.98, 14.39, "*pareil*."],
 [14.69, 16.18, "garde-le pour|_après le déjeuner_."],
 [16.96, 17.69, "le bon geste :"],
 [18.00, 20.22, "_2 minutes_|de brossage,|_2 fois_ par jour."],
 [20.61, 21.70, "tu _craches_|le surplus."],
 [22.04, 22.91, "et tu _ne rinces pas_."],
 [23.61, 24.91, "abonne-toi|pour plus de tips."],
 [25.53, 27.92, "et la prochaine fois|que tu poses ta brosse,|souviens-toi :"]];
const CAPS = [];
for (const [a, b, txt] of S) {
  const parts = txt.split('|'), tot = parts.reduce((s, p) => s + p.length, 0); let acc = 0;
  for (const p of parts) { CAPS.push({ t: Math.max(0, a + (b - a) * acc / tot - 0.04), txt: p }); acc += p.length; }
}
const EV = { study: [3.44, 5.75], water: [5.85, 11.9], bottle: [12.50, 14.6], xb: 13.98, clock: [14.69, 16.75], anti: [16.96, 17.85],
  brush: [18.0, 20.4], spit: 20.61, nox: [22.04, 23.5], sub: [23.61, 25.45], click: 24.4, back: 25.53 };
// grains de fluor sur la couronne (positions locales à la dent)
const DOTS = [];
for (let i = 0; i < 22; i++) {
  const u = i / 21, x = lerp(-140, 140, u), top = -150 - 40 * Math.sin(Math.PI * u) * (Math.abs(u - 0.5) > 0.12 ? 1 : 0.4);
  DOTS.push({ x: x + Math.sin(i * 7.3) * 8, y: top - 16 - (i % 3) * 14, ph: i * 0.37, fall: 0.15 * (i % 7) });
}
// protection : 1 au début, chute sous l'eau, remonte au brossage, 1 à la fin (boucle)
function prot(t) {
  if (t < EV.water[0] + 0.4) return 1;
  if (t < EV.brush[0]) return lerp(1, 0.2, eIO(seg(t, EV.water[0] + 0.4, EV.water[0] + 2.4)));
  return lerp(0.2, 1, eIO(seg(t, EV.brush[0] + 0.3, EV.brush[1] - 0.2)));
}
const SH = [
 [0, 540, 930, 1.0, 540, 915, 1.05],
 [5.6, 600, 800, 1.22, 610, 790, 1.26],
 [12.3, 620, 820, 1.18, 600, 830, 1.2],
 [17.9, 540, 860, 1.18, 540, 870, 1.22],
 [25.3, 540, 870, 1.22, 540, 930, 1.0]];
function camAt(t) {
  let si = 0; for (let i = 0; i < SH.length; i++) if (t >= SH[i][0]) si = i;
  const s0 = SH[si], s1t = si + 1 < SH.length ? SH[si + 1][0] : DUR - 0.3;
  const dur = si === SH.length - 1 ? 1.8 : (s1t - s0[0]);
  const x = seg(t, s0[0], s0[0] + dur), u = si === SH.length - 1 ? eIO(x) : eIO(x) * 0.85 + x * 0.15;
  return [lerp(s0[1], s0[4], u), lerp(s0[2], s0[5], u), lerp(s0[3], s0[6], u)];
}
// passage de plan : petit glissement quand la caméra change de cible
function shake(t) {
  let x = 0, y = 0;
  for (const [ti, amp] of [[EV.xb, 6], [EV.click, 4]]) {
    if (t >= ti && t < ti + 0.5) { const k = Math.exp(-(t - ti) * 9) * amp; x += k * Math.sin((t - ti) * 71); y += k * Math.cos((t - ti) * 57); }
  }
  return [x, y];
}
let tk = ''; for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2; tk += `<line x1="${(Math.sin(a) * 140).toFixed(1)}" y1="${(-Math.cos(a) * 140).toFixed(1)}" x2="${(Math.sin(a) * 156).toFixed(1)}" y2="${(-Math.cos(a) * 156).toFixed(1)}"/>`; }
$('ticks').innerHTML = tk;
let curCap = -1;
function render(t) {
  const [fx, fy, s] = camAt(t), [kx, ky] = shake(t);
  $('cam').setAttribute('transform', `translate(${(540 + kx).toFixed(2)} ${(900 + ky).toFixed(2)}) scale(${s.toFixed(4)}) translate(${(-fx).toFixed(2)} ${(-fy).toFixed(2)})`);
  const P = prot(t);
  // la dent respire un peu
  const by = Math.sin(t * 2 * Math.PI * 9 / DUR) * 4;
  $('tooth').setAttribute('transform', `translate(540 ${(930 + by).toFixed(2)})`);
  const glow = (0.12 + 0.5 * P) * (0.85 + 0.15 * Math.sin(t * 2 * Math.PI * 18 / DUR));
  $('coat').setAttribute('opacity', glow.toFixed(3)); $('coat2').setAttribute('opacity', glow.toFixed(3));
  // grains de fluor : emportés par l'eau (rouges), reviennent au brossage (menthe)
  let d = '';
  const washing = t >= EV.water[0] + 0.3 && t < EV.brush[0];
  DOTS.forEach((p, i) => {
    let x = p.x, y = p.y + Math.sin(t * 2 * Math.PI * 14 / DUR + p.ph) * 3, o = 1, c = '#5EF5B4', r = 9;
    if (t >= EV.water[0] + 0.3 && t < EV.brush[0] + 0.3) {
      const k = eIO(seg(t, EV.water[0] + 0.4 + p.fall, EV.water[0] + 1.9 + p.fall));
      x = p.x * (1 + 0.35 * k); y = lerp(p.y, 240, k); o = 1 - k; c = k > 0.05 ? '#FF4B2B' : '#5EF5B4';
    }
    if (t >= EV.brush[0] + 0.3) {
      const k = eOut(seg(t, EV.brush[0] + 0.3 + p.fall * 1.2, EV.brush[0] + 1.0 + p.fall * 1.2));
      o = k; r = 9 * (0.6 + 0.4 * spring(k));
    }
    if (o > 0.01) d += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(2)}" fill="${c}" opacity="${o.toFixed(3)}"/>`;
  });
  $('dots').innerHTML = d;
  // verre d'eau qui se verse
  const gO = Math.max(win(t, EV.water[0] - 0.1, EV.water[1], 0.25, 0.4), win(t, EV.nox[0], EV.nox[1], 0.15, 0.3));
  const pour = win(t, EV.water[0] + 0.3, EV.water[0] + 3.2, 0.35, 0.4);
  $('glass').setAttribute('opacity', gO.toFixed(3));
  const gx = t < EV.nox[0] ? 800 : 820, gy = t < EV.nox[0] ? 600 : 760;
  $('glass').setAttribute('transform', `translate(${gx} ${gy}) rotate(${(-62 * pour).toFixed(1)}) scale(${(t < EV.nox[0] ? pop(t, EV.water[0] - 0.1) : pop(t, EV.nox[0])).toFixed(3)})`);
  $('water').setAttribute('opacity', (t < EV.nox[0] ? 1 - 0.7 * seg(t, EV.water[0] + 0.6, EV.water[0] + 3.0) : 1).toFixed(2));
  $('xGlass').setAttribute('opacity', (t >= EV.nox[0] ? eOut(seg(t, EV.nox[0] + 0.15, EV.nox[0] + 0.35)) : 0).toFixed(2));
  $('xGlass').setAttribute('transform', `scale(${pop(t, EV.nox[0] + 0.15).toFixed(3)})`);
  // bain de bouche
  const bO = win(t, EV.bottle[0], EV.bottle[1], 0.2, 0.35), bp = win(t, EV.bottle[0] + 0.25, EV.xb, 0.3, 0.2);
  $('bottle').setAttribute('opacity', bO.toFixed(3));
  $('bottle').setAttribute('transform', `translate(810 600) rotate(${(-70 * bp).toFixed(1)}) scale(${pop(t, EV.bottle[0]).toFixed(3)})`);
  $('xBottle').setAttribute('opacity', eOut(seg(t, EV.xb, EV.xb + 0.15)).toFixed(2));
  $('xBottle').setAttribute('transform', `rotate(${(70 * bp).toFixed(1)}) scale(${pop(t, EV.xb).toFixed(3)})`);
  // filet de liquide
  const so = Math.max(pour * (t < EV.nox[0] ? 1 : 0), bp);
  if (so > 0.02) {
    const ox = bp > 0.02 ? 700 : 720, oy = bp > 0.02 ? 560 : 560;
    $('stream').setAttribute('d', `M${ox} ${oy} Q ${ox - 60} ${oy + 20}, 600 ${(760 + by).toFixed(1)}`);
    $('stream').setAttribute('opacity', so.toFixed(3)); $('stream').setAttribute('stroke-dashoffset', (-t * 220).toFixed(1));
  } else $('stream').setAttribute('opacity', 0);
  // brosse qui frotte
  const brO = win(t, EV.brush[0], EV.brush[1], 0.25, 0.35), bk = eOut(seg(t, EV.brush[0], EV.brush[0] + 0.45));
  $('brush').setAttribute('opacity', brO.toFixed(3));
  const scrub = Math.sin(t * 22) * 40 * seg(t, EV.brush[0] + 0.4, EV.brush[0] + 0.6) * (1 - seg(t, EV.brush[1] - 0.6, EV.brush[1] - 0.3));
  $('brush').setAttribute('transform', `translate(${(lerp(1250, 560, bk) + scrub).toFixed(1)} 690) rotate(-4)`);
  // mousse qui tombe dans le lavabo (on crache)
  let fm = '';
  if (t > EV.spit && t < EV.spit + 1.4) {
    const k = seg(t, EV.spit + 0.15, EV.spit + 0.85), o = 1 - seg(t, EV.spit + 0.9, EV.spit + 1.3);
    const y = lerp(1130, 1200, eIO(k));
    for (let i = 0; i < 5; i++) fm += `<circle cx="${(540 + (i - 2) * 22 + Math.sin(i * 2.1) * 6).toFixed(1)}" cy="${(y - Math.abs(i - 2) * 10 + 0).toFixed(1)}" r="${(18 - Math.abs(i - 2) * 3).toFixed(1)}" fill="#E8E5DB" opacity="${(0.85 * o).toFixed(2)}"/>`;
  }
  $('foam').innerHTML = fm;
  // étincelles menthe quand le fluor revient et au clic
  let spk = '';
  for (const [t0, cx, cy] of [[EV.brush[1] - 0.6, 540, 760]]) if (t > t0 && t < t0 + 1.4) for (let i = 0; i < 10; i++) {
    const k = clamp((t - t0) / 1.4), a = i / 10 * Math.PI * 2 + 0.3, r = 120 + 140 * eOut(k);
    spk += `<circle cx="${(cx + Math.cos(a) * r).toFixed(1)}" cy="${(cy + Math.sin(a) * r * 0.7 - 30 * k).toFixed(1)}" r="${(7 * (1 - k)).toFixed(2)}" fill="#5EF5B4"/>`;
  }
  $('sparks').innerHTML = spk;
  // cartes (une seule à la fois)
  const card = (id, a, b, fi = 0.08, fo = 0.15) => { $(id).style.opacity = win(t, a, b, fi, fo).toFixed(3); $(id).style.transform = `scale(${pop(t, a).toFixed(3)})`; };
  card('study', EV.study[0], EV.study[1]);
  $('stamp').setAttribute('opacity', eOut(seg(t, 4.3, 4.45)).toFixed(2));
  $('stamp').setAttribute('transform', `translate(70 120) rotate(-12) scale(${(1.5 - 0.5 * eOut(seg(t, 4.3, 4.45))).toFixed(3)})`);
  card('clock', EV.clock[0], EV.clock[1]);
  const ck = eIO(seg(t, EV.clock[0], EV.clock[0] + 1.0)), hours = lerp(8.0, 13.0, ck);
  $('mh').setAttribute('transform', `rotate(${(hours * 360).toFixed(1)})`); $('hh').setAttribute('transform', `rotate(${(hours * 30).toFixed(1)})`);
  card('anti', EV.anti[0], EV.anti[1]);
  card('timer', EV.brush[0], EV.brush[1]);
  const sec = Math.round(120 * eIO(seg(t, EV.brush[0] + 0.1, EV.brush[0] + 1.8)));
  $('tm').textContent = Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
  card('sub', EV.sub[0], EV.sub[1], 0.1, 0.25);
  const done = t >= EV.click + 0.08;
  $('btn').className = done ? 'done' : ''; $('btn').textContent = done ? 'ABONNÉ ✓' : "S'ABONNER";
  const press = t >= EV.click && t < EV.click + 0.08 ? 0.92 : (done ? pop(t, EV.click + 0.08, 0.1) : 1);
  $('btn').style.transform = `scale(${press.toFixed(3)})`;
  const cuO = win(t, EV.sub[0] + 0.2, EV.sub[1] - 0.05, 0.15, 0.25), ck2 = eOut(seg(t, EV.sub[0] + 0.2, EV.click - 0.05));
  const tap = t >= EV.click - 0.05 && t < EV.click + 0.15 ? 10 : 0;
  $('cursor').style.opacity = cuO.toFixed(3);
  $('cursor').style.transform = `translate(${lerp(980, 520, ck2).toFixed(1)}px, ${(lerp(1300, 875, ck2) + tap).toFixed(1)}px) scale(${tap ? 0.94 : 1})`;
  // HUD : niveau de fluor
  const gv = Math.max(1, Math.round(P * 5));
  for (let i = 1; i <= 5; i++) { const el = $('g' + i); el.className = 'sg' + (i <= gv ? (gv >= 4 ? ' mint' : gv <= 2 ? ' hot' : ' on') : ''); el.style.opacity = gv <= 1 && i <= gv ? (0.55 + 0.45 * Math.abs(Math.sin(t * 6))).toFixed(2) : 1; }
  $('state').textContent = gv >= 4 ? 'PROTÉGÉ' : gv <= 2 ? 'DILUÉ' : '…';
  $('state').style.color = gv >= 4 ? '#5EF5B4' : gv <= 2 ? '#FF4B2B' : '#E8E5DB';
  let ci = 0; for (let i = 0; i < CAPS.length; i++) if (t >= CAPS[i].t) ci = i;
  const cap = $('cap');
  if (ci !== curCap) {
    curCap = ci;
    cap.innerHTML = '<span class="w" id="capIn">' + CAPS[ci].txt.replace(/\*([^*]+)\*/g, '<span class="r">$1</span>').replace(/_([^_]+)_/g, '<span class="g">$1</span>') + '</span>';
    const w = $('capIn').offsetWidth; cap.dataset.fit = Math.min(1, 900 / Math.max(1, w)).toFixed(4);
  }
  const c = CAPS[ci], t0 = Math.max(0, c.t);
  cap.style.opacity = 1; cap.style.transform = `scale(${(pop(t, t0, 0.08) * parseFloat(cap.dataset.fit || 1)).toFixed(4)})`;
}
window.render = render;
document.fonts.ready.then(() => { render(0); window.__ready = true; });
</script>
</body></html>
