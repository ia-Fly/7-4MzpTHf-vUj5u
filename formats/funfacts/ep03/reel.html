<script>
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eOut = x => 1 - Math.pow(1 - x, 3), eIO = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const spring = x => x <= 0 ? 0 : x >= 1 ? 1 : 1 - Math.exp(-6 * x) * Math.cos(10 * x);
const lerp = (a, b, x) => a + (b - a) * x;
const win = (t, a, b, fi = 0.1, fo = 0.1) => clamp(seg(t, a, a + fi)) * (1 - seg(t, b - fo, b));
const pop = (t, a, d = 0.12) => 0.84 + 0.16 * spring(seg(t, a, a + d * 3));
const DUR = 28.0;
const S = [
 [0.02, 1.94, "les billets|que tu as|déjà *retirés*…"],
 [2.24, 4.61, "ton cerveau|les range dans|l'argent|*déjà dépensé*."],
 [4.98, 7.76, "ils ne sont plus|sur ton compte,|alors tu ne les|*comptes plus*."],
 [8.17, 8.80, "résultat :"],
 [9.04, 12.58, "*6 Britanniques*|*sur 10*|ne savent pas|où est passé|leur dernier retrait."],
 [13.03, 14.03, "et plus c'est petit,"],
 [14.23, 15.16, "plus ça part *vite* :"],
 [15.48, 19.31, "avec 4 pièces,|*63 %*|des étudiants|s'achètent|des bonbons."],
 [19.69, 20.52, "avec un seul billet ?"],
 [20.87, 21.55, "26 %."],
 [22.35, 23.03, "l'astuce :"],
 [23.30, 24.42, "garde|tes _tickets_."],
 [24.75, 26.29, "et la prochaine fois|que tu *retires*…"],
 [26.61, 27.22, "souviens-toi :"]];
const CAPS = [];
for (const [a, b, txt] of S) {
  const parts = txt.split('|'), tot = parts.reduce((s, p) => s + p.length, 0); let acc = 0;
  for (const p of parts) { CAPS.push({ t: Math.max(0, a + (b - a) * acc / tot - 0.04), txt: p }); acc += p.length; }
}
const EV = { grab: 0.2, tag: [2.4, 4.7], tx: 5.0, strike: 6.4, why: [8.17, 8.95], study: [9.04, 12.9], heads: 9.3, q: 10.8,
  study2: [13.03, 21.9], coin: 15.6, bill: 20.0, anti: [22.35, 23.2], env: [23.30, 24.6], back: 24.75 };
const SH = [
 [0, 540, 930, 1.25, 520, 920, 1.32],
 [2.24, 470, 900, 1.45, 470, 900, 1.5],
 [4.98, 640, 940, 1.5, 680, 950, 1.6],
 [8.17, 540, 930, 1.2, 540, 930, 1.2],
 [22.35, 540, 930, 1.3, 540, 960, 1.38],
 [24.75, 520, 920, 1.32, 540, 930, 1.25]];
const GA = [[0, 5], [1.4, 4], [3.0, 3], [6.4, 2], [10.8, 1], [23.3, 5]];
function camAt(t) {
  let si = 0; for (let i = 0; i < SH.length; i++) if (t >= SH[i][0]) si = i;
  const s0 = SH[si], s1t = si + 1 < SH.length ? SH[si + 1][0] : DUR - 0.5;
  const u = eIO(seg(t, s0[0], s1t)) * 0.85 + seg(t, s0[0], s1t) * 0.15;
  return [lerp(s0[1], s0[4], u), lerp(s0[2], s0[5], u), lerp(s0[3], s0[6], u)];
}
function shake(t) {
  let x = 0, y = 0;
  for (const [ti, amp] of [[EV.tag[0] + 0.1, 6], [EV.coin + 0.9, 6]]) {
    if (t >= ti && t < ti + 0.5) { const k = Math.exp(-(t - ti) * 9) * amp; x += k * Math.sin((t - ti) * 71); y += k * Math.cos((t - ti) * 57); }
  }
  return [x, y];
}
const REST = [470, 1010], UP = [500, 900];
// la main lève les billets fraîchement retirés, puis les range ; au bouclage la main est vide (comme au début)
function cashHeld(t) { return eOut(seg(t, 0.3, 0.8)) * (1 - eIO(seg(t, 7.6, 8.1))) + eOut(seg(t, 25.1, 25.5)) * (1 - eIO(seg(t, 27.0, 27.6))); }
function handPos(t) {
  const k = eIO(seg(t, 0.25, 0.8)) * (1 - eIO(seg(t, 2.0, 2.6))) + eIO(seg(t, 25.0, 25.5)) * (1 - eIO(seg(t, 27.0, 27.7)));
  return [[lerp(REST[0], UP[0], k), lerp(REST[1], UP[1], k)], k];
}
let curCap = -1;
function render(t) {
  let [fx, fy, s] = camAt(t);
  const [kx, ky] = shake(t);
  $('cam').setAttribute('transform', `translate(${(540 + kx).toFixed(2)} ${(900 + ky).toFixed(2)}) scale(${s.toFixed(4)}) translate(${(-fx).toFixed(2)} ${(-fy).toFixed(2)})`);
  const br = Math.sin(t * 2.2) * 2.5;
  $('Phead').setAttribute('transform', `translate(380 ${(880 + br).toFixed(2)})`);
  const [[hx, hy], reach] = handPos(t);
  const sx = 455, sy = 1000 + br;
  const ex = (sx + hx) / 2 + 10, ey = Math.max(sy, hy) + 40;
  const d = `M${sx} ${sy.toFixed(1)} Q ${ex.toFixed(1)} ${ey.toFixed(1)} ${hx.toFixed(1)} ${hy.toFixed(1)}`;
  $('Parm').setAttribute('d', d); $('ParmIn').setAttribute('d', d);
  $('hand').setAttribute('transform', `translate(${hx.toFixed(1)} ${hy.toFixed(1)})`);
  $('handCard').setAttribute('opacity', 0);
  const held = cashHeld(t);
  $('handBills').setAttribute('transform', `translate(${(hx + 4).toFixed(1)} ${(hy - 34).toFixed(1)}) rotate(${(-6 + 10 * reach).toFixed(1)}) scale(${(0.8 + 0.4 * reach).toFixed(3)})`);
  $('handBills').setAttribute('opacity', held.toFixed(3));
  // billets qui tombent du distributeur au début (et à la relance)
  let fb = '';
  for (const f0 of [0.0, 24.8]) if (t > f0 && t < f0 + 0.9) for (let i = 0; i < 3; i++) {
    const k = clamp((t - f0 - i * 0.1) / 0.6); if (k <= 0) continue;
    const x = lerp(520 + i * 20, UP[0], eIO(k)), y = lerp(560, UP[1] - 34, eIO(k));
    fb += `<use href="#bill" transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${(-30 + i * 20 + k * 25).toFixed(1)})" opacity="${(1 - seg(t, f0 + 0.55, f0 + 0.8)).toFixed(2)}"/>`;
  }
  // billets qui s'envolent (dépensés sans compter) pendant le sondage → déjà cachés par la carte ; ici à 7.6 la main range
  $('flyBills').innerHTML = fb;
  $('wallet').setAttribute('opacity', win(t, 6.9, 8.4, 0.2, 0.3).toFixed(3));
  // visage : à l'aise, puis perplexe (« où sont mes 50 € ? »)
  const lost = win(t, 21.9, 22.5, 0.01, 0.01) * 0;
  const conf = 0;
  $('Pmouth').setAttribute('d', `M12 34 Q 28 40 44 34`);
  $('Pbrow').setAttribute('d', '');
  $('pain').setAttribute('opacity', 0);
  // étiquette « déjà dépensé » sur les billets
  $('tagNo').setAttribute('opacity', win(t, EV.tag[0], EV.tag[1], 0.08, 0.2).toFixed(3));
  $('tagNo').setAttribute('transform', `translate(-310 -80) translate(560 820) scale(${pop(t, EV.tag[0]).toFixed(3)}) translate(-560 -820)`);
  // téléphone : solde déjà débité, la ligne « retrait » s'efface
  $('tpeAmt').textContent = '390,00€';
  $('tpeAmt').setAttribute('fill', '#E8E5DB');
  $('txLine').setAttribute('opacity', (win(t, EV.tx, 8.3, 0.15, 0.3) * (1 - 0.6 * seg(t, EV.strike, EV.strike + 0.3))).toFixed(3));
  $('txStrike').setAttribute('opacity', win(t, EV.strike, 8.3, 0.1, 0.3).toFixed(3));
  $('txStrike').setAttribute('x2', (-56 + 112 * eOut(seg(t, EV.strike, EV.strike + 0.35))).toFixed(1));
  let bp = 0, br2 = 60;
  for (const ti of [EV.tx]) if (t >= ti && t < ti + 0.6) { const k = (t - ti) / 0.6; bp = 1 - k; br2 = 60 + 70 * k; }
  $('beep').setAttribute('opacity', bp.toFixed(3)); $('beep').setAttribute('r', br2.toFixed(1));
  // ticket de caisse (astuce)
  const envO = win(t, EV.env[0], EV.env[1] + 0.2, 0.15, 0.35);
  $('env').setAttribute('opacity', envO.toFixed(3));
  $('env').setAttribute('transform', `translate(540 ${(1000 - 30 * eOut(seg(t, EV.env[0], EV.env[0] + 0.4))).toFixed(1)}) scale(${pop(t, EV.env[0]).toFixed(3)})`);
  $('envBills').setAttribute('opacity', eOut(seg(t, EV.env[0] + 0.3, EV.env[0] + 0.8)).toFixed(3));
  $('P').setAttribute('opacity', (1 - 0.75 * envO).toFixed(3));
  $('tpe').setAttribute('opacity', (1 - 0.75 * envO).toFixed(3));
  let sp = '';
  if (t > EV.env[0] + 0.6 && t < EV.env[0] + 2.1) for (let i = 0; i < 10; i++) {
    const k = clamp((t - EV.env[0] - 0.6) / 1.5), a = i / 10 * Math.PI * 2 + 0.3, r = 120 + 140 * eOut(k);
    sp += `<circle cx="${(540 + Math.cos(a) * r).toFixed(1)}" cy="${(970 + Math.sin(a) * r * 0.7 - 50 * k).toFixed(1)}" r="${(7 * (1 - k)).toFixed(2)}" fill="#5EF5B4"/>`;
  }
  $('sparks').innerHTML = sp;
  const card = (id, a, b, fi = 0.08, fo = 0.15) => { $(id).style.opacity = win(t, a, b, fi, fo).toFixed(3); $(id).style.transform = `scale(${pop(t, a).toFixed(3)})`; };
  // carte sondage : 10 silhouettes, 6 deviennent « ? »
  card('study', EV.study[0], EV.study[1]);
  let g = '';
  for (let i = 0; i < 10; i++) {
    const c = i % 5, r = Math.floor(i / 5), x = 130 + c * 160, y = 170 + r * 230;
    const on = clamp((t - EV.heads - i * 0.08) / 0.12);
    const red = i < 6 ? eOut(seg(t, EV.q + i * 0.12, EV.q + i * 0.12 + 0.2)) : 0;
    const col = red > 0.5 ? '#FF4B2B' : '#E8E5DB';
    g += `<g opacity="${on.toFixed(2)}" transform="translate(${x} ${y})"><circle cy="-20" r="34" fill="#2E3035" stroke="${col}" stroke-width="5"/><path d="M-50 90 Q-50 30 0 30 Q50 30 50 90 Z" fill="#2E3035" stroke="${col}" stroke-width="5"/>` +
      (red > 0 ? `<text y="-6" text-anchor="middle" font-family="Anton" font-size="${(44 * (0.6 + 0.4 * spring(red))).toFixed(1)}" fill="#FF4B2B">?</text>` : '') + `</g>`;
  }
  g += `<text x="450" y="620" text-anchor="middle" font-family="Anton" font-size="56" fill="#FF4B2B" opacity="${eOut(seg(t, EV.q + 0.8, EV.q + 1.1)).toFixed(2)}">6 SUR 10 : AUCUNE IDÉE</text>`;
  $('studySvg').innerHTML = g;
  // carte dénomination
  card('study2', EV.study2[0], EV.study2[1]);
  const H = 280 / 70;
  const hC = eOut(seg(t, EV.coin, EV.coin + 1.0)), hB = eOut(seg(t, EV.bill + 0.9, EV.bill + 1.6));
  $('barCoin').setAttribute('y', (520 - 63 * H * hC).toFixed(1)); $('barCoin').setAttribute('height', (63 * H * hC).toFixed(1));
  $('valCoin').setAttribute('y', (500 - 63 * H * hC).toFixed(1)); $('valCoin').textContent = Math.round(63 * hC) + ' %';
  $('barBill').setAttribute('y', (520 - 26 * H * hB).toFixed(1)); $('barBill').setAttribute('height', (26 * H * hB).toFixed(1));
  $('valBill').setAttribute('y', (500 - 26 * H * hB).toFixed(1)); $('valBill').textContent = Math.round(26 * hB) + ' %';
  card('why', EV.why[0], EV.why[1]);
  card('anti', EV.anti[0], EV.anti[1]);
  let gv = 5; for (const [ti, v] of GA) if (t >= ti) gv = v;
  const mint = t >= 23.3 && t < 24.75;
  for (let i = 1; i <= 5; i++) { const el = $('g' + i); el.className = 'sg' + (i <= gv ? (mint ? ' mint' : gv <= 2 ? ' hot' : ' on') : ''); el.style.opacity = gv <= 1 && i <= gv ? (0.55 + 0.45 * Math.abs(Math.sin(t * 6))).toFixed(2) : 1; }
  $('state').textContent = mint ? 'SOUS CONTRÔLE' : gv <= 1 ? 'PERDU DE VUE' : gv <= 3 ? 'EN BAISSE' : 'SUIVI';
  $('state').style.color = mint ? '#5EF5B4' : gv <= 3 ? '#FF4B2B' : '#E8E5DB';
  let ci = 0; for (let i = 0; i < CAPS.length; i++) if (t >= CAPS[i].t) ci = i;
  const cap = $('cap');
  if (ci !== curCap) {
    curCap = ci;
    cap.innerHTML = '<span class="w" id="capIn">' + CAPS[ci].txt.replace(/\*([^*]+)\*/g, '<span class="r">$1</span>').replace(/_([^_]+)_/g, '<span class="g">$1</span>') + '</span>';
    const w = $('capIn').offsetWidth; cap.dataset.fit = Math.min(1, 900 / Math.max(1, w)).toFixed(4);
  }
  const c = CAPS[ci], t0 = Math.max(0, c.t);
  cap.style.opacity = 1; cap.style.transform = `scale(${(pop(t, t0, 0.08) * parseFloat(cap.dataset.fit || 1)).toFixed(4)})`;
}
window.render = render;
document.fonts.ready.then(() => { render(0); window.__ready = true; });
</script>
</body></html>
