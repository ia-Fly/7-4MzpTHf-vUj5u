<script>
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eOut = x => 1 - Math.pow(1 - x, 3), eIO = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const spring = x => x <= 0 ? 0 : x >= 1 ? 1 : 1 - Math.exp(-6 * x) * Math.cos(10 * x);
const lerp = (a, b, x) => a + (b - a) * x;
const win = (t, a, b, fi = 0.1, fo = 0.1) => clamp(seg(t, a, a + fi)) * (1 - seg(t, b - fo, b));
const pop = (t, a, d = 0.12) => 0.84 + 0.16 * spring(seg(t, a, a + d * 3));
const DUR = 28.0;
const S = [
 [0.06, 1.54, "tu dors|moins de *6 heures*|par nuit ?"],
 [2.28, 3.50, "ton *rhume*|vient peut-être|de là."],
 [4.50, 7.54, "des chercheurs|ont suivi|le sommeil|de *164* adultes,"],
 [7.70, 9.46, "puis leur ont mis|un *virus*|du rhume|dans le nez."],
 [10.40, 11.42, "moins de *6 heures* ?"],
 [11.76, 14.72, "*4 fois plus*|de risques|de tomber malade|qu'au-delà|de _7 heures_."],
 [15.56, 18.32, "ça comptait|*plus*|que l'âge,|le stress|ou la cigarette."],
 [19.34, 19.90, "l'antidote ?"],
 [20.24, 21.14, "plus de _7 heures_."],
 [21.50, 22.22, "_écran coupé_,"],
 [22.40, 23.50, "coucher|à _heure fixe_."],
 [24.44, 27.40, "alors ce soir,|avant un|*dernier épisode*,|demande-toi :"]];
const CAPS = [];
for (const [a, b, txt] of S) {
  const parts = txt.split('|'), tot = parts.reduce((s, p) => s + p.length, 0); let acc = 0;
  for (const p of parts) { CAPS.push({ t: Math.max(0, a + (b - a) * acc / tot - 0.04), txt: p }); acc += p.length; }
}
const EV = { virus: 2.28, study: [4.50, 7.62], drop: [7.70, 9.80], bars: [10.40, 15.20], grow: 11.80, rank: [15.56, 18.70],
  ages: [16.35, 17.05, 17.55], anti: [19.34, 20.15], lie: 20.24, off: 21.50, fix: 22.40, back: 24.44, pop2: 25.6 };
// plans caméra [t, fx, fy, s, fx2, fy2, s2] — le dernier revient au cadrage du début (boucle)
const SH = [
 [0, 520, 960, 1.15, 515, 950, 1.2],
 [2.28, 515, 950, 1.2, 380, 900, 1.55],
 [4.50, 520, 960, 1.15, 520, 960, 1.15],
 [18.6, 520, 960, 1.15, 525, 965, 1.2],
 [20.24, 535, 975, 1.18, 545, 980, 1.2],
 [24.44, 545, 980, 1.2, 520, 960, 1.15]];
function camAt(t) {
  let si = 0; for (let i = 0; i < SH.length; i++) if (t >= SH[i][0]) si = i;
  const s0 = SH[si], s1t = si + 1 < SH.length ? SH[si + 1][0] : DUR - 0.35;
  const u = eIO(seg(t, s0[0], s1t));
  return [lerp(s0[1], s0[4], u), lerp(s0[2], s0[5], u), lerp(s0[3], s0[6], u)];
}
function shake(t) {
  let x = 0, y = 0;
  for (const [ti, amp] of [[EV.virus + 0.05, 7], [EV.grow + 0.1, 6]]) {
    if (t >= ti && t < ti + 0.5) { const k = Math.exp(-(t - ti) * 9) * amp; x += k * Math.sin((t - ti) * 71); y += k * Math.cos((t - ti) * 57); }
  }
  return [x, y];
}
// grille des 164 adultes
const ORDER = [];
(function () {
  let s = ''; let n = 0;
  for (let r = 0; r < 14; r++) for (let c = 0; c < 12; c++) {
    if (n >= 164) break;
    const x = 62 + c * 71, y = 34 + r * 37.5;
    s += `<g id="p${n}" opacity="0" transform="translate(${x} ${y})"><circle cx="0" cy="-6" r="8" fill="#2E3035" stroke="#E8E5DB" stroke-width="2.5"/><path d="M-13 14 Q 0 0 13 14" fill="none" stroke="#E8E5DB" stroke-opacity="0.65" stroke-width="2.5" stroke-linecap="round"/></g>`;
    n++;
  }
  $('grid').innerHTML = s;
  for (let i = 0; i < 164; i++) ORDER.push(i);
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 163; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [ORDER[i], ORDER[j]] = [ORDER[j], ORDER[i]]; }
})();
const VIR = [[-140, -60, 0.9, 0.0], [130, -110, 0.75, 0.6], [-90, 110, 0.7, 1.3], [170, 40, 0.85, 2.1], [-30, -170, 0.7, 2.9], [60, 150, 0.65, 3.7], [-190, 50, 0.6, 4.4]];
function render(t) {

  // couché (plus de 7 h) puis se redresse (boucle)

  $('arm').setAttribute('opacity', shown.toFixed(3));

  $('popup').setAttribute('opacity', pp.toFixed(3));
  $('popup').setAttribute('transform', `translate(595 816) scale(${(t > 20 ? pop(t, EV.pop2) : 1).toFixed(3)}) translate(-595 -816)`);
  // réveil
  const ck = $('clockT');
  if (t >= EV.lie && t < EV.fix) { ck.textContent = '7 H +'; ck.setAttribute('fill', '#5EF5B4'); }

  card('study', EV.study[0], EV.study[1]);
  const shownN = Math.round(164 * eOut(seg(t, EV.study[0] + 0.3, 6.9)));

  $('cnt').textContent = shownN;
  card('drop', EV.drop[0], EV.drop[1]);
  let d = '';

  let gv = 4, mint = false;

  for (let i = 1; i <= 5; i++) { const el = $('g' + i); el.className = 'sg' + (i <= gv ? (mint ? ' mint' : gv >= 4 ? ' hot' : ' on') : ''); el.style.opacity = gv >= 5 && i <= gv ? (0.55 + 0.45 * Math.abs(Math.sin(t * 6))).toFixed(2) : 1; }
  $('state').textContent = mint ? 'FAIBLE' : gv >= 5 ? '×4' : 'ÉLEVÉ';
  $('state').style.color = mint ? '#5EF5B4' : '#FF4B2B';
