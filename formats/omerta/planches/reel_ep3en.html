      <g id="tagConf" opacity="0">

  <svg class="full" viewBox="0 0 1080 1920" style="pointer-events:none">

      <text x="272" y="258" text-anchor="end" font-family="JB Mono" font-weight="700" font-size="20" fill="#FF4B2B">3:00 AM</text>
      <text x="150" y="318" text-anchor="middle" font-family="JB Mono" font-weight="700" font-size="22" letter-spacing="3" fill="#26282D">YOU · 3:00 AM</text>

  <div class="mini mono"><div class="l"><span class="dot"></span>OMERTÀ · EPISODE 3</div><div class="rt"><span id="clk">11:53 PM</span><span class="pl">· YOUR KITCHEN</span></div></div>

    <div class="gauge"><span class="lab">HEART RATE</span><span class="sg" id="g1"></span><span class="sg" id="g2"></span><span class="sg" id="g3"></span><span class="sg" id="g4"></span><span class="sg" id="g5"></span></div>
    <div class="debtH" id="debtH"><span>DEBT</span><span class="v" id="debtV">€40,000</span></div>
  </div>

  <div id="count" class="card chip"><div class="in" id="countN">10</div></div>

  <div id="rule" class="card"><div class="hd">RULE #3</div><div class="tx">SILENCE<br>IS <span class="j" id="ruleJ">GOLDEN.</span></div></div>

</div>
<script>
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eOut = x => 1 - Math.pow(1 - x, 3), eIO = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const spring = x => x <= 0 ? 0 : x >= 1 ? 1 : 1 - Math.exp(-6 * x) * Math.cos(10 * x);
const lerp = (a, b, x) => a + (b - a) * x;
const win = (t, a, b, fi = 0.1, fo = 0.1) => clamp(seg(t, a, a + fi)) * (1 - seg(t, b - fo, b));
const pop = (t, a, d = 0.12) => 0.84 + 0.16 * spring(seg(t, a, a + d * 3));
const step = (t, pts) => { let v = pts[0][1], k = pts[0][0]; for (const [ti, vi] of pts) if (t >= ti) { v = vi; k = ti; } return [v, k]; };
let TL, EV, SH, CAPS;
function shake(t) {
  let x = 0, y = 0;
  for (const [ti, amp] of [[0.05, 5], [EV.nothing, 3], [EV.sugar, 5], [EV.gone, 4], [EV.sealed, 3], [EV.next, 4]]) {
    if (t >= ti && t < ti + 0.5) { const k = Math.exp(-(t - ti) * 9) * amp; x += k * Math.sin((t - ti) * 71); y += k * Math.cos((t - ti) * 57); }
  }
  // battements de cœur pendant le compte à rebours
  const [c0, c1] = EV.count;
  if (t > c0 && t < c1) { const ph = ((t - c0) * (1.6 + 1.4 * seg(t, c0, c1))) % 1; const k = Math.exp(-ph * 14) * 4; y += k; }
  return [x, y];
}
let curCap = -1;
function camAt(t) {
  let si = 0; for (let i = 0; i < SH.length; i++) if (t >= SH[i][0]) si = i;
  const s0 = SH[si], s1t = si + 1 < SH.length ? SH[si + 1][0] : EV.END, u = eIO(seg(t, s0[0], s1t)) * 0.85 + seg(t, s0[0], s1t) * 0.15;
  return [lerp(s0[1], s0[4], u), lerp(s0[2], s0[5], u), lerp(s0[3], s0[6], u) * (1.045 - 0.045 * eOut(seg(t, s0[0], s0[0] + 0.3)))];
}
function render(t) {
  let [fx, fy, s] = camAt(t);
  const [L0, L1] = EV.loop;
  if (t > L0) { const k = eIO(seg(t, L0, L1)); const [ex, ey, es] = camAt(L0); fx = lerp(ex, SH[0][1], k); fy = lerp(ey, SH[0][2], k); s = Math.exp(lerp(Math.log(es), Math.log(SH[0][3] * 1.045), k)); }
  const CAMO = new URLSearchParams(location.search).get('cam');
  if (CAMO) [fx, fy, s] = CAMO.split(',').map(Number);
  const [kx, ky] = shake(t);
  $('cam').setAttribute('transform', `translate(${(540 + kx).toFixed(2)} ${(900 + ky).toFixed(2)}) scale(${s.toFixed(4)}) translate(${(-fx).toFixed(2)} ${(-fy).toFixed(2)})`);
  // ---------- décor fixe de l'épisode 3 ----------
  $('man').setAttribute('opacity', 0); $('manSit').setAttribute('opacity', 1); $('manSit').setAttribute('transform', '');
  $('cntCupA').setAttribute('opacity', 0); $('cntCupB').setAttribute('opacity', 0); $('pourBox').setAttribute('opacity', 0);
  $('inset').setAttribute('opacity', 0); $('bubble').setAttribute('opacity', 0); $('tagPoison').setAttribute('opacity', 0); $('tagZero').setAttribute('opacity', 0);
  $('photoMourn').setAttribute('opacity', 0); $('mokaSteam').setAttribute('opacity', 0);
  $('sweat').setAttribute('opacity', t < EV.nothing + 0.6 ? 0.9 : 0);
  $('sweat').setAttribute('transform', `translate(0 ${(((t * 0.8) % 1) * 18).toFixed(1)})`);
  // ---------- tu bois : la tasse monte à la bouche puis revient sur la table ----------
  const [d0, d1, d2] = EV.drink;
  const back = eIO(seg(t, d1, d2));
  const tilt = lerp(-62 - 14 * seg(t, d0, d1), 0, back);
  const ax = lerp(774, 778, back), ay = lerp(986, 1132, back);
  $('tCupA').setAttribute('opacity', 1);
  $('tCupA').setAttribute('transform', `translate(${ax.toFixed(1)} ${ay.toFixed(1)}) rotate(${tilt.toFixed(1)})`);
  $('tCupB').setAttribute('opacity', 1); $('tCupB').setAttribute('transform', 'translate(884 1132)');
  document.querySelectorAll('#tCupB .stm')[0].innerHTML = '';
  const sg = clamp(seg(t, EV.sugar, EV.sugar + 0.25));
  $('glowR').setAttribute('opacity', (1 - sg).toFixed(3)); $('glowG').setAttribute('opacity', sg.toFixed(3));
  $('tagSugar').setAttribute('opacity', win(t, EV.sugar, EV.cta[0] + 0.6, 0.08, 0.15));
  $('tagSugar').setAttribute('transform', `translate(782 1062) scale(${pop(t, EV.sugar).toFixed(3)})`);
  // ---------- le parrain : sourire, hochement ----------
  const nod = Math.sin(clamp((t - EV.nod) / 0.5) * Math.PI * 2) * 7 * (t > EV.nod && t < EV.nod + 0.5 ? 1 : 0);
  $('pHead').setAttribute('transform', `translate(0 ${nod.toFixed(2)})`);
  $('smile').setAttribute('opacity', clamp(seg(t, EV.smile, EV.smile + 0.2)));
  // ---------- l'enveloppe glisse vers toi ----------
  const [e0, e1] = EV.env, ek = eOut(seg(t, e0, e1));
  $('env').setAttribute('opacity', clamp(seg(t, e0 - 0.15, e0)));
  $('env').setAttribute('transform', `translate(${lerp(930, 818, ek).toFixed(1)} 1110)`);
  $('seal').setAttribute('transform', `translate(0 4) scale(${(t >= EV.sealed ? 0.8 + 0.5 * spring(seg(t, EV.sealed, EV.sealed + 0.36)) : 1).toFixed(3)}) translate(0 -4)`);
  $('tagSealed').setAttribute('opacity', win(t, EV.noname, EV.open - 0.05, 0.08, 0.12));
  $('tagSealed').setAttribute('transform', `translate(818 1064) scale(${pop(t, EV.noname).toFixed(3)})`);
  const endFade = 1 - seg(t, EV.loop[0], EV.loop[0] + 0.25);
  const oA = win(t, EV.open, EV.END + 1, 0.12, 0.1) * endFade, dA = win(t, EV.deliver, EV.END + 1, 0.12, 0.1) * endFade;
  $('tagConf').setAttribute('opacity', oA); $('tagDrink').setAttribute('opacity', dA);
  $('tagConf').setAttribute('transform', `translate(615 1059) scale(${(1.4 * pop(t, EV.open)).toFixed(3)}) translate(-615 -1059)`);
  $('tagDrink').setAttribute('transform', `translate(890 1059) scale(${(1.4 * pop(t, EV.deliver)).toFixed(3)}) translate(-890 -1059)`);
  // ---------- interface : horloge, rythme cardiaque, dette ----------
  const [mm] = step(t, EV.clk); $('clk').textContent = `11:${String(mm).padStart(2, '0')} PM`;
  const [gv, gk] = step(t, EV.gauge);
  const blink = gv >= 5 ? (0.55 + 0.45 * Math.abs(Math.sin(t * 9))) : 1;
  for (let i = 1; i <= 5; i++) {
    const el = $('g' + i); el.className = 'sg' + (i <= gv ? (gv >= 4 ? ' hot' : ' on') : '');
    el.style.opacity = i <= gv && gv >= 5 ? blink.toFixed(2) : 1;
    el.style.transform = i === gv ? `scaleY(${(0.6 + 0.4 * spring(seg(t, gk, gk + 0.3))).toFixed(3)})` : 'none';
  }
  const paid = t >= EV.gone;
  $('debtH').style.opacity = 1; $('debtH').className = 'debtH' + (paid ? ' paid' : '');
  $('debtV').textContent = paid ? '€0' : '€40,000';
  $('debtH').style.transform = `scale(${pop(t, paid ? EV.gone : -9).toFixed(3)})`;
  // ---------- cartes ----------
  $('vote').style.opacity = win(t, EV.vote[0], EV.vote[1], 0.06, 0.12); $('vote').style.transform = `scale(${pop(t, EV.vote[0]).toFixed(3)})`;
  const [c0, c1] = EV.count, cn = Math.max(0, Math.ceil(10 * (1 - seg(t, c0, c1 - 0.15))));
  $('count').style.opacity = win(t, c0, c1 + 0.35, 0.06, 0.15); $('countN').textContent = cn === 0 ? '0 …' : String(cn);
  $('count').style.transform = `scale(${(0.92 + 0.08 * Math.exp(-((t - c0) * 2.6 % 1) * 6)).toFixed(3)})`;
  $('cta').style.opacity = win(t, EV.cta[0] + 0.05, EV.cta[1], 0.08, 0.12); $('cta').style.transform = `scale(${pop(t, EV.cta[0] + 0.05).toFixed(3)})`;
  $('rule').style.opacity = win(t, EV.rule[0], EV.rule[1], 0.07, 0.12); $('rule').style.transform = `scale(${pop(t, EV.rule[0]).toFixed(3)})`;
  $('ruleJ').style.transform = `scale(${(t >= EV.like ? 0.86 + 0.14 * spring(seg(t, EV.like, EV.like + 0.36)) * 1.08 : 1).toFixed(3)})`;
  $('comment').style.opacity = win(t, EV.comment, EV.next + 0.1, 0.08, 0.1).toFixed(3); $('comment').style.transform = `scale(${pop(t, EV.comment).toFixed(3)})`;
  $('next').style.opacity = (clamp(seg(t, EV.next, EV.next + 0.08)) * endFade).toFixed(3); $('next').style.transform = `scale(${pop(t, EV.next).toFixed(3)})`;
  // ---------- sous-titres (rouge *…*, menthe _…_) ----------
  let ci = -1; for (let i = 0; i < CAPS.length; i++) if (t >= CAPS[i].t) ci = i;
  const cap = $('cap');
  if (ci !== curCap) {
    curCap = ci;
    if (ci >= 0) {
      cap.className = CAPS[ci].boss ? 'boss' : '';
      cap.innerHTML = '<span class="w" id="capIn">' + CAPS[ci].txt.replace(/\*([^*]+)\*/g, '<span class="r">$1</span>').replace(/_([^_]+)_/g, '<span class="g">$1</span>') + '</span>';
      const w = $('capIn').offsetWidth; cap.dataset.fit = Math.min(1, 830 / Math.max(1, w)).toFixed(4);
    } else { cap.innerHTML = ''; cap.dataset.fit = 1; }
  }
  if (ci >= 0) { const c = CAPS[ci]; cap.style.opacity = (clamp(seg(t, c.t, c.t + 0.05)) * endFade).toFixed(3); cap.style.transform = `scale(${(pop(t, c.t, 0.08) * parseFloat(cap.dataset.fit || 1)).toFixed(4)})`; }
}
window.render = render;
fetch('tl_ep3en.json').then(r => r.json()).then(tl => {
  TL = tl; EV = tl.ev; SH = tl.shots; CAPS = tl.caps;
  document.fonts.ready.then(() => { render(0); window.__ready = true; });
});
</script>
