let curCap = -1;
function render(t) {

  $('lighter').setAttribute('transform', `translate(${(W[0] + 8).toFixed(1)} ${(W[1] - 10).toFixed(1)})`);

  $('flame').setAttribute('transform', `scale(${(0.6 + 0.4 * spring(seg(t, EV.flame, EV.flame + 0.3))).toFixed(3)})`);

  const fireOn = eOut(seg(t, EV.fire, EV.fire + 0.18)) * (1 - seg(t, N4 - 0.05, N4));

  $('flames').setAttribute('opacity', fireOn.toFixed(3));

  });
  $('fireHalo').setAttribute('opacity', (0.3 * fireOn * flick).toFixed(3));
  $('burnt').setAttribute('opacity', t >= N4 ? 1 : 0);
  $('smoke').setAttribute('opacity', (t >= N4 && t < TL.seg.n05 + 0.2 ? 0.4 : 0));
  $('sm1').setAttribute('transform', `translate(0 ${(-((t * 18) % 30)).toFixed(1)})`); $('sm2').setAttribute('transform', `translate(0 ${(-((t * 14 + 12) % 30)).toFixed(1)})`);

  // jours qui défilent, puis la nuit

  if (t >= N4 && t < TL.seg.n05) day = 0.5;
  if (t > d0 && t < d1) { const p = (t - d0) / (d1 - d0) * 4; $('daysVal').textContent = 'DAY ' + Math.min(4, Math.floor(p) + 1); day = Math.sin(Math.PI * (p % 1)); }
  $('lblDays').setAttribute('opacity', (t > d0 && t < d1) ? 1 : 0);
  $('winBg').setAttribute('fill', mixHex('#16181D', '#56606E', day));
  const nightA = (t >= d1 && t < EV.lamp_on) ? 0.42 : 0;
  $('night').style.opacity = nightA;

  // cuisine : braise dans le noir, la lumière s'allume
  const LO = EV.lamp_on, flickL = t >= LO && t < LO + 0.16 ? (Math.sin((t - LO) * 90) > 0 ? 1 : 0.3) : (t >= LO ? 1 : 0);
  $('dark').setAttribute('opacity', (1 - flickL).toFixed(3));
  $('cone').setAttribute('opacity', flickL); $('bulb').setAttribute('opacity', 0.2 + 0.8 * flickL);
  $('cigar').setAttribute('opacity', flickL); $('csmoke').setAttribute('opacity', flickL * 0.9);
